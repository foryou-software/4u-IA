<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>4UMap — demo interactivo · FOURYOU</title>
  <script>document.documentElement.dataset.theme = localStorage.getItem("fy-theme") || "dark";</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css">
  <link rel="stylesheet" href="demos.css">
</head>
<body>
  <header class="nav scrolled">
    <a class="nav-logo" href="../demo.html?s=map" aria-label="Volver a 4UMap">
      <svg class="mark" viewBox="0 0 96 96" width="24" height="24" fill="none" aria-hidden="true">
        <path d="M24 30 L8 48 L24 66"/><path d="M72 30 L88 48 L72 66"/>
        <path class="mk-4" d="M46 30 L34 50 H52"/><path class="mk-4" d="M46 42 V66"/>
        <path class="mk-s" d="M64 30 L54 66"/>
      </svg>
      <span class="wordmark">FOURYOU</span>
      <span class="word-sub mono">4UMap</span>
    </a>
    <div class="nav-actions" style="margin-left:auto">
      <a class="ctl" href="../demo.html?s=map" data-t="nav">← Ficha del sistema</a>
      <button class="lang-toggle" id="langToggle" type="button" aria-label="Switch language">
        <span data-lang-opt="en">EN</span><span class="lang-sep">/</span><span data-lang-opt="es" class="on">ES</span>
      </button>
      <button class="theme-toggle" id="themeToggle" type="button" aria-label="Cambiar tema" aria-pressed="false">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
          <circle class="sun-core" cx="12" cy="12" r="4.2"/>
          <g class="sun-rays"><path d="M12 2.5v2.6M12 18.9v2.6M2.5 12h2.6M18.9 12h2.6M5 5l1.8 1.8M17.2 17.2 19 19M19 5l-1.8 1.8M6.8 17.2 5 19"/></g>
          <path class="moon" d="M20 13.2A8.1 8.1 0 0 1 10.8 4 8.1 8.1 0 1 0 20 13.2Z"/>
        </svg>
      </button>
    </div>
  </header>
  <div class="app">
    <div class="app-bar">
      <div class="app-title"><h1><em class="fu">4U</em>Map</h1><span class="mono" data-t="sub">PLATAFORMA SIG · ACTIVOS EN CAMPO</span></div>
      <div class="app-controls"><button class="ctl" id="btnMeasure" type="button">⟋ <span data-t="measure">Medir distancia</span></button><button class="ctl" id="btnTerr" type="button">▰ <span data-t="terr">Territorio</span></button></div>
    </div>
    <div class="app-main">
      <div class="app-canvas"><div class="map-wrap"><div id="map"></div><div class="map-fallback" id="mapFallback" hidden><p data-t="offline">El mapa requiere conexión a internet.</p></div></div></div>
      <aside class="app-side">
        <p class="feed-title mono" data-t="layersT">CAPAS</p>
        <div>
          <div class="layer-row"><span data-t="lyStates">Estados de México</span><button class="sw on" id="lyStates" type="button" aria-label="Estados"></button></div>
          <div class="layer-row"><span data-t="lyAssets">Activos de campo</span><button class="sw on" id="lyAssets" type="button" aria-label="Activos"></button></div>
          <div class="layer-row"><span data-t="lyCover">Cobertura de señal</span><button class="sw" id="lyCover" type="button" aria-label="Cobertura"></button></div>
        </div>
  <div class="kpis"><div class="kpi"><b id="kAssets">0</b><span data-t="kAssets">ACTIVOS VISIBLES</span></div><div class="kpi"><b id="kOnline">0</b><span data-t="kOnline">EN LÍNEA</span></div><div class="kpi"><b id="kDist">—</b><span data-t="kDist">ÚLTIMA MEDICIÓN</span></div><div class="kpi alert"><b id="kAlerts">2</b><span data-t="kAlerts">SIN SEÑAL</span></div></div><p class="feed-title mono" data-t="feedT">ACTIVIDAD</p><div class="feed" id="feed"></div></aside>
    </div>
  </div>
  
  <span class="demo-ribbon mono" data-t="ribbon">DEMO CONCEPTUAL · DATOS SIMULADOS</span>
  <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
  <script src="../fy-motion.js" defer></script>
  <script src="map.js" defer></script>
</body>
</html>
