<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>4UDate — demo interactivo · FOURYOU</title>
  <script>document.documentElement.dataset.theme = localStorage.getItem("fy-theme") || "dark";</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css">
  <link rel="stylesheet" href="demos.css">
</head>
<body>
  <header class="nav scrolled">
    <a class="nav-logo" href="../demo.html?s=date" aria-label="Volver a 4UDate">
      <svg class="mark" viewBox="0 0 96 96" width="24" height="24" fill="none" aria-hidden="true">
        <path d="M24 30 L8 48 L24 66"/><path d="M72 30 L88 48 L72 66"/>
        <path class="mk-4" d="M46 30 L34 50 H52"/><path class="mk-4" d="M46 42 V66"/>
        <path class="mk-s" d="M64 30 L54 66"/>
      </svg>
      <span class="wordmark">FOURYOU</span>
      <span class="word-sub mono">4UDate</span>
    </a>
    <div class="nav-actions" style="margin-left:auto">
      <a class="ctl" href="../demo.html?s=date" data-t="nav">← Ficha del sistema</a>
      <button class="lang-toggle" id="langToggle" type="button" aria-label="Switch language">
        <span data-lang-opt="en">EN</span><span class="lang-sep">/</span><span data-lang-opt="es" class="on">ES</span>
      </button>
      <button class="theme-toggle" id="themeToggle" type="button" aria-label="Cambiar tema" aria-pressed="false">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
          <circle class="sun-core" cx="12" cy="12" r="4.2"/>
          <g class="sun-rays"><path d="M12 2.5v2.6M12 18.9v2.6M2.5 12h2.6M18.9 12h2.6M5 5l1.8 1.8M17.2 17.2 19 19M19 5l-1.8 1.8M6.8 17.2 5 19"/></g>
          <path class="moon" d="M20 13.2A8.1 8.1 0 0 1 10.8 4 8.1 8.1 0 1 0 20 13.2Z"/>
        </svg>
      </button>
    </div>
  </header>

  <div class="app">
    <div class="app-bar">
      <div class="app-title">
        <h1><em class="fu">4U</em>Date</h1>
        <span class="mono" data-t="sub">AGENDA · SEMANA EN CURSO</span>
      </div>
      <div class="app-controls">
        <label class="ctl" for="selBranch"><span data-t="branch">Sucursal</span>
          <select id="selBranch"><option value="0" data-t="bC">Centro</option><option value="1" data-t="bN">Norte</option></select>
        </label>
        <label class="ctl" for="selSvc"><span data-t="svcF">Servicio</span>
          <select id="selSvc"><option value="" data-t="allS">Todos</option><option value="0" data-t="s1">Consulta general</option><option value="1" data-t="s2">Laboratorio</option><option value="2" data-t="s3">Seguimiento</option></select>
        </label>
        <button class="ctl" id="btnRem" type="button"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m4.5 7.5 7.5 5.5 7.5-5.5"/></svg> <span data-t="rem">Enviar recordatorios</span></button></div>
    </div>
    <div class="app-main">
      <div class="app-canvas" style="overflow:auto; padding: var(--s3);"><div class="cal" id="cal"></div></div>
      <aside class="app-side"><div class="kpis"><div class="kpi"><b id="kOcc">0%</b><span data-t="kOcc">OCUPACIÓN</span></div><div class="kpi"><b id="kConf">0</b><span data-t="kConf">CONFIRMADAS</span></div><div class="kpi"><b id="kToday">0</b><span data-t="kToday">CITAS EN SEMANA</span></div><div class="kpi alert"><b id="kNoShow">0</b><span data-t="kNoShow">INASISTENCIAS</span></div></div><p class="feed-title mono" data-t="feedT">ACTIVIDAD</p><div class="feed" id="feed"></div></aside>
    </div>
  </div>
  
  <div class="modal-bg" id="modalBg">
    <div class="modal">
      <h2 id="mTitle" data-t="mNew">Nueva cita</h2>
      <p class="demo-note mono" id="mSlot"></p>
      <div id="mNewBody">
        <label class="frm-l"><span data-t="mName">Nombre del paciente</span><input id="mName"></label>
        <label class="frm-l"><span data-t="mSvc">Servicio</span>
          <select id="mSvc"><option data-t="s1">Consulta general</option><option data-t="s2">Laboratorio</option><option data-t="s3">Seguimiento</option></select>
        </label>
        <div class="opts"><button class="btn btn-primary" id="mBook" type="button" data-t="mBookB">Reservar</button></div>
      </div>
      <div id="mEditBody" hidden>
        <div class="opts">
          <button class="ctl" id="mConfirm" type="button" data-t="mConfB">✓ Confirmar asistencia</button>
          <button class="ctl" id="mNoShow" type="button" data-t="mNSB">Marcar inasistencia</button>
          <button class="ctl danger" id="mDel" type="button" data-t="mDelB">Cancelar cita</button>
        </div>
      </div>
      <div class="opts"><button class="ctl" id="mClose" type="button" data-t="mBack">Volver</button></div>
    </div>
  </div>
  <span class="demo-ribbon mono" data-t="ribbon">DEMO CONCEPTUAL · DATOS SIMULADOS</span>
  <script src="../fy-motion.js" defer></script>
  <script src="date.js" defer></script>
</body>
</html>
